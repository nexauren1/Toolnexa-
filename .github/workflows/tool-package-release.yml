name: ToolNexa Tool Packages

on:
  push:
    branches:
      - main
    paths:
      - "feature_business/**"
      - "feature_image/**"
      - "feature_audio/**"
      - "app/build.gradle.kts"
      - "app/src/main/java/com/toolnexa/app/ToolRegistry.kt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Validate base version
        run: |
          set -euo pipefail
          VERSION_CODE=$(grep -E 'versionCode = ' app/build.gradle.kts | head -1 | awk '{print $3}')
          VERSION_NAME=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "versionCode=$VERSION_CODE"
          echo "versionName=$VERSION_NAME"

      - name: Build feature packages
        run: |
          set -euo pipefail
          gradle :feature_business:assembleRelease :feature_image:assembleRelease :feature_audio:assembleRelease

      - name: Prepare package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-output

          find feature_business/build/outputs/apk/release             -maxdepth 1 -type f -name '*.apk' -print -quit             | xargs -I{} cp "{}" package-output/toolnexa-feature_business.apk

          find feature_image/build/outputs/apk/release             -maxdepth 1 -type f -name '*.apk' -print -quit             | xargs -I{} cp "{}" package-output/toolnexa-feature_image.apk

          find feature_audio/build/outputs/apk/release             -maxdepth 1 -type f -name '*.apk' -print -quit             | xargs -I{} cp "{}" package-output/toolnexa-feature_audio.apk

          test -s package-output/toolnexa-feature_business.apk
          test -s package-output/toolnexa-feature_image.apk
          test -s package-output/toolnexa-feature_audio.apk

      - name: Build package manifest
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE=$(grep -E 'versionCode = ' app/build.gradle.kts | head -1 | awk '{print $3}')
          VERSION_NAME=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | cut -d '"' -f2)

          BUSINESS_REV=$(git rev-parse HEAD:feature_business)
          IMAGE_REV=$(git rev-parse HEAD:feature_image)
          AUDIO_REV=$(git rev-parse HEAD:feature_audio)

          cat > package-output/toolnexa-packages.json <<EOF
          {
            "baseVersionCode": $VERSION_CODE,
            "baseVersionName": "$VERSION_NAME",
            "packages": {
              "feature_business": {
                "category": "Business",
                "revision": "$BUSINESS_REV",
                "asset": "toolnexa-feature_business.apk"
              },
              "feature_image": {
                "category": "Imagem",
                "revision": "$IMAGE_REV",
                "asset": "toolnexa-feature_image.apk"
              },
              "feature_audio": {
                "category": "Áudio",
                "revision": "$AUDIO_REV",
                "asset": "toolnexa-feature_audio.apk"
              }
            }
          }
          EOF

          cat package-output/toolnexa-packages.json

      - name: Publish package release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view tool-packages >/dev/null 2>&1; then
            gh release upload tool-packages               package-output/toolnexa-feature_business.apk               package-output/toolnexa-feature_image.apk               package-output/toolnexa-feature_audio.apk               package-output/toolnexa-packages.json               --clobber

            gh release edit tool-packages               --title "ToolNexa Tool Packages"               --notes "Current downloadable split packages for ToolNexa base version $(grep -E 'versionName = "' app/build.gradle.kts | head -1 | cut -d '"' -f2)."
          else
            gh release create tool-packages               package-output/toolnexa-feature_business.apk               package-output/toolnexa-feature_image.apk               package-output/toolnexa-feature_audio.apk               package-output/toolnexa-packages.json               --title "ToolNexa Tool Packages"               --notes "Current downloadable split packages for the ToolNexa base app."               --latest=false
          fi
