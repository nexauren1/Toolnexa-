name: ToolNexa Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: toolnexa-android-release-v3
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TOOLNEXA_KEYSTORE_BASE64: ${{ secrets.TOOLNEXA_KEYSTORE_BASE64 }}
      TOOLNEXA_STORE_PASSWORD: ${{ secrets.TOOLNEXA_STORE_PASSWORD }}
      TOOLNEXA_KEY_ALIAS: ${{ secrets.TOOLNEXA_KEY_ALIAS }}
      TOOLNEXA_KEY_PASSWORD: ${{ secrets.TOOLNEXA_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Validate project inputs
        run: |
          set -euo pipefail
          test -f app/google-services.json
          grep -q 'applicationId = "com.toolnexa.app"' app/build.gradle.kts
          grep -q 'versionName = "' app/build.gradle.kts
          gradle --version

      - name: Configure release signing
        if: env.TOOLNEXA_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          test -n "$TOOLNEXA_STORE_PASSWORD"
          test -n "$TOOLNEXA_KEY_ALIAS"
          test -n "$TOOLNEXA_KEY_PASSWORD"
          # The existing ToolNexa upload keystore was validated with
          # the keystore password for both store and key.
          mkdir -p app/signing
          printf '%s' "$TOOLNEXA_KEYSTORE_BASE64" | base64 --decode > app/signing/toolnexa-upload.p12
          test -s app/signing/toolnexa-upload.p12
          cat >> app/build.gradle.kts <<'EOF'

          android.signingConfigs.create("ciRelease") {
              storeFile = file("signing/toolnexa-upload.p12")
              storePassword = System.getenv("TOOLNEXA_STORE_PASSWORD")
              keyAlias = System.getenv("TOOLNEXA_KEY_ALIAS")
              // The upload keystore uses the store password for its key.
              keyPassword = System.getenv("TOOLNEXA_STORE_PASSWORD")
          }

          android.buildTypes.getByName("release").signingConfig =
              android.signingConfigs.getByName("ciRelease")
          EOF

          for module in feature_business feature_image feature_audio; do
            cat >> "$module/build.gradle.kts" <<'EOF'

android.signingConfigs.create("ciRelease") {
    storeFile = file("../app/signing/toolnexa-upload.p12")
    storePassword = System.getenv("TOOLNEXA_STORE_PASSWORD")
    keyAlias = System.getenv("TOOLNEXA_KEY_ALIAS")
    keyPassword = System.getenv("TOOLNEXA_STORE_PASSWORD")
}

android.buildTypes.getByName("release").signingConfig =
    android.signingConfigs.getByName("ciRelease")
EOF
          done

      - name: Build APK
        run: |
          set -euo pipefail
          if [ -f app/signing/toolnexa-upload.p12 ]; then
            gradle :app:assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk toolnexa.apk
          else
            gradle :app:assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk toolnexa.apk
          fi
          test -s toolnexa.apk

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ToolNexa-v${{ steps.version.outputs.version }}
          path: toolnexa.apk
          if-no-files-found: error


      - name: Build feature packages
        run: |
          set -euo pipefail

          if [ -f app/signing/toolnexa-upload.p12 ]; then
            gradle :feature_business:assembleRelease :feature_image:assembleRelease :feature_audio:assembleRelease
            BUILD_TYPE=release
          else
            gradle :feature_business:assembleDebug :feature_image:assembleDebug :feature_audio:assembleDebug
            BUILD_TYPE=debug
          fi

          mkdir -p package-output

          find "feature_business/build/outputs/apk/$BUILD_TYPE" -maxdepth 1 -type f -name '*.apk' -print -quit             | xargs -I{} cp "{}" package-output/toolnexa-feature_business.apk
          find "feature_image/build/outputs/apk/$BUILD_TYPE" -maxdepth 1 -type f -name '*.apk' -print -quit             | xargs -I{} cp "{}" package-output/toolnexa-feature_image.apk
          find "feature_audio/build/outputs/apk/$BUILD_TYPE" -maxdepth 1 -type f -name '*.apk' -print -quit             | xargs -I{} cp "{}" package-output/toolnexa-feature_audio.apk

          test -s package-output/toolnexa-feature_business.apk
          test -s package-output/toolnexa-feature_image.apk
          test -s package-output/toolnexa-feature_audio.apk

      - name: Build package manifest
        run: |
          set -euo pipefail
          VERSION_CODE=$(grep -E 'versionCode = ' app/build.gradle.kts | head -1 | awk '{print $3}')
          VERSION_NAME=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | cut -d '"' -f2)

          BUSINESS_REV=$(git rev-parse HEAD:feature_business)
          IMAGE_REV=$(git rev-parse HEAD:feature_image)
          AUDIO_REV=$(git rev-parse HEAD:feature_audio)

          mkdir -p package-output
          cat > package-output/toolnexa-packages.json <<EOF
          {
            "baseVersionCode": $VERSION_CODE,
            "baseVersionName": "$VERSION_NAME",
            "packages": {
              "feature_business": {
                "category": "Business",
                "revision": "$BUSINESS_REV",
                "asset": "toolnexa-feature_business.apk"
              },
              "feature_image": {
                "category": "Imagem",
                "revision": "$IMAGE_REV",
                "asset": "toolnexa-feature_image.apk"
              },
              "feature_audio": {
                "category": "Áudio",
                "revision": "$AUDIO_REV",
                "asset": "toolnexa-feature_audio.apk"
              }
            }
          }
          EOF

      - name: Publish ToolNexa tool packages
        run: |
          set -euo pipefail
          export GH_TOKEN="$GITHUB_TOKEN"

          if gh release view tool-packages >/dev/null 2>&1; then
            gh release upload tool-packages               package-output/toolnexa-feature_business.apk               package-output/toolnexa-feature_image.apk               package-output/toolnexa-feature_audio.apk               package-output/toolnexa-packages.json               --clobber
            gh release edit tool-packages               --title "ToolNexa Tool Packages"               --notes "Current split packages for ToolNexa base version $VERSION_NAME."
          else
            gh release create tool-packages               package-output/toolnexa-feature_business.apk               package-output/toolnexa-feature_image.apk               package-output/toolnexa-feature_audio.apk               package-output/toolnexa-packages.json               --title "ToolNexa Tool Packages"               --notes "Current split packages for the ToolNexa base app."               --latest=false
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="ToolNexa Android v$VERSION

          Firebase Authentication with Google, e-mail/password and international phone SMS verification, Firebase Analytics, Word Counter, image tools, local Audio to MIDI melody conversion, Cloudflare Worker integration, Background Remover using Cloudflare Images / BiRefNet, Nexauren X user storage, a refreshed technology-focused UI, and Firebase update notifications."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" toolnexa.apk --clobber
            gh release edit "$TAG" --title "ToolNexa Android v$VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" toolnexa.apk --title "ToolNexa Android v$VERSION" --notes "$NOTES"
          fi
